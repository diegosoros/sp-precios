ument.getElementById('result'),status=document.getElementById('status');function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(n))}function render(){const term=q.value.trim().toLowerCase();if(!term){result.innerHTML='';status.textContent='Escribe un código para comenzar.';return}const rows=data.filter(r=>r.code.toLowerCase().includes(term));if(!rows.length){result.innerHTML='<div style="background:#f6efe5;border:1px solid #cdbdaa;border-radius:14px;padding:18px">No encontré ese código.</div>';status.textContent='';return}const product=rows[0].product;const groups={};rows.forEach(r=>(groups[r.technique]??=[]).push(r));let html='<div style="margin-bottom:12px"><div style="font-size:13px;color:#a94e21;font-weight:700">'+rows[0].code+'</div><div style="font-size:24px;font-weight:800">'+product+'</div></div>';Object.entries(groups).forEach(([tech,items])=>{html+='<div style="background:#f6efe5;border:1px solid #cdbdaa;border-radius:14px;padding:16px;margin:12px 0"><div style="font-weight:800;margin-bottom:10px">'+tech+'</div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:10px;border-bottom:1px solid #cdbdaa">Cantidad</th><th style="text-align:right;padding:10px;border-bottom:1px solid #cdbdaa">Precio</th></tr></thead><tbody>';items.forEach(r=>html+='<tr><td style="padding:10px;border-bottom:1px solid #e0d5c7">'+r.qty_range+'</td><td style="padding:10px;text-align:right;font-weight:800;border-bottom:1px solid #e0d5c7">'+money(r.price)+' c/u</td></tr>');html+='</tbody></table></div></div>'});result.innerHTML=html;status.textContent=rows.length+' opciones encontradas.'}document.getElementById('btnSearch').addEventListener('click',render);q.addEventListener('keydown',e=>{if(e.key==='Enter')render()});document.getElementById('btnReset').addEventListener('click',()=>{data=seed.map(x=>({code:x[0],product:x[1],technique:x[2],qty_
