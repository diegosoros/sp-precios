<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>viste. stills</title>
<style>
  @font-face{font-family:Archivo;src:url(assets/fonts/Archivo-var.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:block}
  @font-face{font-family:Geist;src:url(assets/fonts/Geist-var.woff2) format('woff2');font-weight:100 900;font-display:block}
  :root{--canvas:#F3EFE7;--ink:#0B0B0B;--gold:#EFA83A}
  html,body{margin:0;background:var(--canvas)}
  #stage{position:relative;width:1440px;height:1440px;overflow:hidden;background:var(--canvas);font-family:Geist,sans-serif;color:var(--ink)}
  .abs{position:absolute}
  .word{font-family:Archivo;font-variation-settings:'wdth' 125,'wght' 800;letter-spacing:-.01em;line-height:1;white-space:nowrap}
  .rim{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 2px 1px rgba(255,255,255,.65),inset 0 -2px 4px rgba(0,0,0,.18);
    background:linear-gradient(155deg,rgba(255,255,255,.32),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 72%,rgba(255,255,255,.14))}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<div id="stage"></div>
<script>
const $s = document.getElementById('stage'), defs = document.getElementById('defs');
const el = (tag, css = {}, html = '', parent = $s) => { const e = document.createElement(tag); Object.assign(e.style, css); e.innerHTML = html; parent.appendChild(e); return e; };
const px = v => `${v}px`;

// ---------- vidrio líquido ----------
// mapa de desplazamiento: campo de distancia de un rectángulo redondeado (R = x, G = y)
function dispMap(w, h, r, band) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), id = g.createImageData(w, h), hx = w / 2, hy = h / 2;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const qx = Math.abs(x + .5 - hx) - (hx - r), qy = Math.abs(y + .5 - hy) - (hy - r);
    const d = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
    let nx = 0, ny = 0;
    if (qx > 0 && qy > 0) { const l = Math.hypot(qx, qy); nx = qx / l; ny = qy / l; } else if (qx > qy) nx = 1; else ny = 1;
    nx *= Math.sign(x + .5 - hx) || 1; ny *= Math.sign(y + .5 - hy) || 1;
    const e = -d, t = clamp(1 - e / band), m = e < 0 ? 0 : t * t;
    const i = (y * w + x) * 4;
    id.data[i] = 128 - nx * m * 127; id.data[i + 1] = 128 - ny * m * 127; id.data[i + 2] = 128; id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0); return c.toDataURL();
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
let fid = 0;
function glassFilter(w, h, r, band, scale) { return mapFilter(dispMap(w, h, r, band), w, h, scale); }
function mapFilter(href, w, h, scale) {
  const id = `lg${fid++}`;
  const ch = (c, s) => `<feDisplacementMap in="SourceGraphic" in2="m" scale="${s}" xChannelSelector="R" yChannelSelector="G" result="d${c}"/>
    <feColorMatrix in="d${c}" type="matrix" values="${c == 'r' ? 1 : 0} 0 0 0 0  0 ${c == 'g' ? 1 : 0} 0 0 0  0 0 ${c == 'b' ? 1 : 0} 0 0  0 0 0 1 0" result="${c}"/>`;
  defs.insertAdjacentHTML('beforeend', `<filter id="${id}" x="0" y="0" width="${w}" height="${h}" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feImage href="${href}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/>
    ${ch('r', scale)}${ch('g', scale * 1.07)}${ch('b', scale * 1.14)}
    <feBlend in="r" in2="g" mode="screen" result="rg"/><feBlend in="rg" in2="b" mode="screen" result="rgb"/>
    <feColorMatrix in="rgb" type="saturate" values="1.3"/></filter>`);
  return id;
}
// capas de la escena (en coordenadas del stage) que cada vidrio clona detrás de sí
function clipLayer(L) { // inset(top right bottom left) relativo a la capa
  if (!L.clip) return '';
  const [x0, y0, x1, y1] = L.clip;
  return `inset(${y0 - L.by}px ${L.bx + L.bw - x1}px ${L.by + L.bh - y1}px ${x0 - L.bx}px)`;
}
function layersInto(parent, layers, ox, oy) {
  layers.forEach(L => el('div', { position: 'absolute', left: px(L.bx - ox), top: px(L.by - oy), width: px(L.bw), height: px(L.bh),
    backgroundImage: `url(${L.src})`, backgroundSize: '100% 100%', clipPath: clipLayer(L) }, '', parent));
}
function glass({ x, y, w, h, r, layers, band = Math.min(w, h) * .32, scale = 70, tint = 'rgba(255,255,255,.10)', shadow = '0 18px 44px rgba(0,0,0,.25)', zoom = 1, spec = 0, parent = $s }) {
  const g = el('div', { position: 'absolute', left: px(x), top: px(y), width: px(w), height: px(h), borderRadius: px(r), overflow: 'hidden', boxShadow: shadow }, '', parent);
  const clone = el('div', { position: 'absolute', left: 0, top: 0, width: px(w), height: px(h), overflow: 'hidden', filter: `url(#${glassFilter(w, h, r, band, scale)})` }, '', g);
  const inner = el('div', { position: 'absolute', inset: 0, transform: `scale(${zoom})`, transformOrigin: 'center' }, '', clone);
  layersInto(inner, layers, x, y);
  el('div', { position: 'absolute', inset: 0, background: tint }, '', g);
  if (spec) el('div', { position: 'absolute', inset: 0, borderRadius: 'inherit',
    background: `radial-gradient(ellipse 60% 38% at 32% 16%,rgba(255,255,255,${.55 * spec}),rgba(255,255,255,0) 70%),radial-gradient(ellipse 50% 30% at 72% 92%,rgba(255,255,255,${.22 * spec}),rgba(255,255,255,0) 70%)` }, '', g);
  el('div', {}, '', g).className = 'rim';
  return g;
}

// letras de vidrio: el campo de distancia de cada glifo da el mapa, la máscara y los brillos
function glassText({ x, y, w, h, text, font, spacing = 0, dy = 0, layers, scale = 30, blur = 7, tint = 'rgba(255,255,255,.16)', parent = $s }) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.font = font; g.letterSpacing = `${spacing}px`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.fillText(text, w / 2, h / 2 + dy);
  const mask = c.toDataURL();
  const fc = document.createElement('canvas'); fc.width = w; fc.height = h;
  const fg = fc.getContext('2d'); fg.filter = `blur(${blur}px)`; fg.drawImage(c, 0, 0);
  const A = fg.getImageData(0, 0, w, h).data, a = (xx, yy) => A[((Math.min(h - 1, Math.max(0, yy)) * w) + Math.min(w - 1, Math.max(0, xx))) * 4 + 3] / 255;
  const map = fg.createImageData(w, h), hi = fg.createImageData(w, h);
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
    const gx = a(xx + 1, yy) - a(xx - 1, yy), gy = a(xx, yy + 1) - a(xx, yy - 1), len = Math.hypot(gx, gy) || 1e-6;
    const nx = gx / len, ny = gy / len, m = clamp(len * blur * 1.3), v = a(xx, yy), edge = clamp(4 * v * (1 - v));
    const i = (yy * w + xx) * 4;
    map.data[i] = 128 + nx * m * 127; map.data[i + 1] = 128 + ny * m * 127; map.data[i + 2] = 128; map.data[i + 3] = 255;
    const L = nx * .55 + ny * .83;
    hi.data[i] = hi.data[i + 1] = hi.data[i + 2] = 255;
    hi.data[i + 3] = 255 * edge * clamp(.18 + .9 * Math.max(0, L) + .35 * Math.max(0, -L));
  }
  fg.filter = 'none'; fg.putImageData(map, 0, 0); const mapURL = fc.toDataURL();
  fg.putImageData(hi, 0, 0); const hiURL = fc.toDataURL();
  const box = el('div', { position: 'absolute', left: px(x), top: px(y), width: px(w), height: px(h), WebkitMaskImage: `url(${mask})`, WebkitMaskSize: '100% 100%' }, '', parent);
  const clone = el('div', { position: 'absolute', inset: 0, overflow: 'hidden', filter: `url(#${mapFilter(mapURL, w, h, scale)})` }, '', box);
  layersInto(clone, layers, x, y);
  el('div', { position: 'absolute', inset: 0, background: tint }, '', box);
  el('div', { position: 'absolute', inset: 0, backgroundImage: `url(${hiURL})`, backgroundSize: '100% 100%' }, '', box);
  return box;
}
// foto recortada → capa que llena una caja
function photoLayer(src, W, H, [cx, cy, cw, ch], [bx, by, bw, bh], clip) {
  const k = Math.max(bw / cw, bh / ch);
  return { src, bx: bx - cx * k + (bw - cw * k) / 2, by: by - cy * k + (bh - ch * k) / 2, bw: W * k, bh: H * k, clip: clip || [bx, by, bx + bw, by + bh] };
}
function paint(parent, layers, ox = 0, oy = 0) { layersInto(parent, layers, ox, oy); }

const CURSOR = s => `<svg width="${24 * s}" height="${34 * s}" viewBox="-2 -2 24 34"><path d="M0 0 L0 23 L6 17.5 L10 27 L14 25.2 L10 16 L18 16 Z" fill="#0B0B0B" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const cursor = (x, y, s = 2.2, parent = $s) => el('div', { position: 'absolute', left: px(x), top: px(y), filter: 'drop-shadow(0 3px 5px rgba(0,0,0,.3))' }, CURSOR(s), parent);
const ICON = {
  sun: `<svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><circle cx="24" cy="24" r="8"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<line x1="24" y1="6" x2="24" y2="11" transform="rotate(${a} 24 24)"/>`).join('')}</svg>`,
  sunset: `<svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M12 32a12 12 0 0 1 24 0"/><line x1="6" y1="32" x2="42" y2="32"/><line x1="12" y1="39" x2="36" y2="39"/>${[-60, -30, 0, 30, 60].map(a => `<line x1="24" y1="10" x2="24" y2="14" transform="rotate(${a} 24 32)"/>`).join('')}</svg>`,
  play: `<svg viewBox="0 0 24 24" width="30" height="30"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#666" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`,
};
const IMG = { p3: ['assets/img/p3.jpg', 1122, 1402], p4: ['assets/img/p4.jpg', 1254, 1254], p8: ['assets/img/p8.jpg', 1122, 1402], p8g: ['assets/img/p8-golden.jpg', 1122, 1402] };
const PL = (k, crop, box, clip) => photoLayer(IMG[k][0], IMG[k][1], IMG[k][2], crop, box, clip);

// ---------- stills ----------
const STILL = {
  // b1 = último cuadro: el wordmark
  open() {
    const w = el('div', { position: 'absolute', left: 0, right: 0, top: '560px', textAlign: 'center', fontSize: '300px' }, 'viste.');
    w.className = 'word';
  },

  // b20: arrastre de la luz, día → atardecer; perilla convertida en lente de vidrio
  glass() {
    const crop = [425, 245, 697, 697], box = [0, 0, 1440, 1440], wipe = 905;
    const day = PL('p8', crop, box), gold = PL('p8g', crop, box, [0, 0, wipe, 1440]);
    const scene = [day, gold];
    paint($s, scene);
    el('div', { position: 'absolute', left: px(wipe - 1), top: 0, width: '2px', height: '1440px', background: 'rgba(255,255,255,.85)' });
    // chip superior
    const chip = glass({ x: 545, y: 90, w: 350, h: 84, r: 42, layers: scene, scale: 40 });
    el('div', { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '14px', color: '#fff', fontSize: '30px', fontWeight: 600, letterSpacing: '-.01em' }, `${ICON.sunset.replace(/44/g, 34)}Atardecer · 68%`, chip);
    // slider de vidrio
    const T = { x: 230, y: 1170, w: 980, h: 128 };
    const track = glass({ ...T, r: 64, layers: scene, scale: 60 });
    el('div', { position: 'absolute', left: '34px', top: '42px' }, ICON.sun, track);
    el('div', { position: 'absolute', right: '34px', top: '42px' }, ICON.sunset, track);
    const tx0 = T.x + 110, tx1 = T.x + T.w - 110, kx = wipe;
    el('div', { position: 'absolute', left: px(tx0 - T.x), top: '60px', width: px(tx1 - tx0), height: '8px', borderRadius: '4px', background: 'rgba(255,255,255,.35)' }, '', track);
    el('div', { position: 'absolute', left: px(tx0 - T.x), top: '60px', width: px(kx - tx0), height: '8px', borderRadius: '4px', background: '#fff' }, '', track);
    // perilla = lente (agarrada: crece y se levanta)
    const L = 176;
    glass({ x: kx - L / 2, y: T.y + T.h / 2 - L / 2 - 26, w: L, h: L, r: L / 2, layers: scene, band: L / 2, scale: 120, zoom: 1.35, spec: 1, tint: 'rgba(255,255,255,.08)', shadow: '0 22px 40px rgba(0,0,0,.32)' });
    cursor(kx + 18, T.y + 56);
  },

  // b32: el fondo del iPhone se soltó en Safari y es el hero de la landing
  stage() {
    // ventana Mac / Safari
    const W = { x: 330, y: 190, w: 1050, h: 1010 };
    const win = el('div', { position: 'absolute', left: px(W.x), top: px(W.y), width: px(W.w), height: px(W.h), borderRadius: '24px', background: '#FBFAF7', overflow: 'hidden', boxShadow: '0 40px 90px rgba(0,0,0,.20), 0 0 0 1px rgba(0,0,0,.08)' });
    const bar = el('div', { position: 'absolute', left: 0, right: 0, top: 0, height: '104px', background: '#ECE9E3', borderBottom: '1px solid #DAD6CE' }, '', win);
    ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => el('div', { position: 'absolute', left: px(26 + i * 30), top: '24px', width: '16px', height: '16px', borderRadius: '50%', background: c }, '', bar));
    el('div', { position: 'absolute', left: '150px', top: '12px', height: '40px', padding: '0 22px', borderRadius: '10px', background: '#FBFAF7', display: 'flex', alignItems: 'center', gap: '10px', fontSize: '17px', fontWeight: 600 },
      `<span class="word" style="font-size:16px">viste.</span><span style="color:#777;font-weight:500">Merch para tu marca</span>`, bar);
    el('div', { position: 'absolute', left: '300px', right: '300px', top: '60px', height: '34px', borderRadius: '10px', background: '#DEDAD3', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', fontSize: '16px', color: '#555', fontWeight: 500 },
      `${ICON.lock}MH Branding · Merch`, bar);
    // nav
    const nav = el('div', { position: 'absolute', left: '44px', right: '44px', top: '128px', height: '60px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }, '', win);
    el('div', { fontSize: '40px' }, 'viste.', nav).className = 'word';
    el('div', { display: 'flex', gap: '34px', fontSize: '19px', fontWeight: 500, color: '#555' }, '<span>Playeras</span><span>Gorras</span><span>Polos</span><span>Uniformes</span>', nav);
    el('div', { padding: '14px 26px', borderRadius: '30px', background: 'var(--ink)', color: '#fff', fontSize: '19px', fontWeight: 600 }, 'Pedir merch', nav);
    el('div', { position: 'absolute', left: '44px', top: '226px', fontSize: '66px', fontWeight: 650, letterSpacing: '-.035em', lineHeight: 1 }, 'Tu marca también se viste.', win);
    el('div', { position: 'absolute', left: '46px', top: '310px', fontSize: '23px', fontWeight: 450, color: '#6b6b6b' }, 'Playeras, gorras y uniformes con tu logo. DTF · Bordado · Serigrafía · Sublimación', win);
    const hero = { x: W.x + 44, y: W.y + 372, w: W.w - 88, h: 590 };
    const heroL = PL('p3', [0, 90, 1122, 701], [hero.x, hero.y, hero.w, hero.h]);
    const hb = el('div', { position: 'absolute', left: px(hero.x), top: px(hero.y), width: px(hero.w), height: px(hero.h), borderRadius: '22px', overflow: 'hidden' });
    paint(hb, [heroL], hero.x, hero.y);
    // iPhone
    const P = { x: 70, y: 560, w: 340, h: 712, bz: 14 };
    el('div', { position: 'absolute', left: px(P.x), top: px(P.y), width: px(P.w), height: px(P.h), borderRadius: '62px', background: '#0B0B0B', boxShadow: '0 40px 80px rgba(0,0,0,.28), inset 0 0 0 2px #2a2a2a' });
    const S = { x: P.x + P.bz, y: P.y + P.bz, w: P.w - 2 * P.bz, h: P.h - 2 * P.bz };
    const wall = PL('p3', [680, 0, 442, 969], [S.x, S.y, S.w, S.h]);
    const scr = el('div', { position: 'absolute', left: px(S.x), top: px(S.y), width: px(S.w), height: px(S.h), borderRadius: '50px', overflow: 'hidden' });
    paint(scr, [wall], S.x, S.y);
    el('div', { position: 'absolute', left: '0', right: '0', top: '78px', textAlign: 'center', color: 'rgba(255,255,255,.92)', fontSize: '19px', fontWeight: 600 }, 'domingo, 2 de noviembre', scr);
    glassText({ x: S.x, y: S.y + 92, w: S.w, h: 150, text: '9:41', font: '700 138px Geist', spacing: -5, dy: 6, layers: [wall], scale: 34, blur: 6 });
    el('div', { position: 'absolute', left: px((S.w - 112) / 2), top: '14px', width: '112px', height: '32px', borderRadius: '16px', background: '#000' }, '', scr);
    const mp = glass({ x: S.x + 16, y: S.y + S.h - 128, w: S.w - 32, h: 96, r: 34, layers: [wall], scale: 46, tint: 'rgba(18,18,18,.42)' });
    el('div', { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', gap: '14px', padding: '0 20px', color: '#fff' },
      `<img src="assets/img/logo-light.png" style="width:56px;height:56px;object-fit:contain;background:#000;border-radius:12px;padding:4px;box-sizing:border-box"><div style="flex:1;line-height:1.2"><div style="font-size:17px;font-weight:650">Merch para tu marca</div><div style="font-size:15px;opacity:.8">MH Branding</div></div>${ICON.play}`, mp);
    cursor(hero.x + 620, hero.y + 300);
  },

  // b47: el cuadro colgado en la pared (pared de prueba hasta tener el clip de Pexels)
  wall() {
    $s.style.background = 'linear-gradient(160deg,#EEE7DB 0%,#E6DDCF 55%,#DCD2C2 100%)';
    el('div', { position: 'absolute', left: '700px', top: '-200px', width: '1100px', height: '900px', background: 'radial-gradient(ellipse at 40% 50%,rgba(255,246,226,.75),rgba(255,246,226,0) 62%)' });
    const leaves = el('div', { position: 'absolute', inset: 0, filter: 'blur(7px)', opacity: .5 });
    [[1160, 60, 260, 70, 35], [1060, 210, 300, 80, 60], [1240, 300, 240, 64, 15], [980, 380, 220, 60, 75], [1180, 470, 260, 70, 40], [1320, 140, 200, 56, 100], [1100, 560, 200, 52, 55]]
      .forEach(([x, y, w, h, r]) => el('div', { position: 'absolute', left: px(x), top: px(y), width: px(w), height: px(h), borderRadius: '50%', background: 'rgba(70,58,44,.55)', transform: `rotate(${r}deg)` }, '', leaves));
    el('div', { position: 'absolute', left: '900px', top: '-40px', width: '10px', height: '760px', background: 'rgba(70,58,44,.4)', transform: 'rotate(28deg)', transformOrigin: 'top', filter: 'blur(6px)' });
    // marco
    const F = { x: 450, y: 250, w: 540, h: 720, mold: 30, mat: 68 };
    el('div', { position: 'absolute', left: px(F.x), top: px(F.y), width: px(F.w), height: px(F.h), background: '#141414',
      boxShadow: '-26px 34px 50px rgba(40,30,20,.30), -6px 10px 14px rgba(40,30,20,.25), inset 0 0 0 2px #2b2b2b, inset 3px 3px 0 #262626, inset -3px -3px 0 #050505' });
    const M = { x: F.x + F.mold, y: F.y + F.mold, w: F.w - 2 * F.mold, h: F.h - 2 * F.mold };
    el('div', { position: 'absolute', left: px(M.x), top: px(M.y), width: px(M.w), height: px(M.h), background: '#F7F4EE', boxShadow: 'inset 4px 5px 8px rgba(0,0,0,.20)' });
    const I = { x: M.x + F.mat, y: M.y + F.mat, w: M.w - 2 * F.mat, h: M.h - 2 * F.mat };
    const pr = el('div', { position: 'absolute', left: px(I.x), top: px(I.y), width: px(I.w), height: px(I.h), overflow: 'hidden', boxShadow: '0 0 0 1px rgba(0,0,0,.12), inset 0 0 0 1px rgba(0,0,0,.1)' });
    paint(pr, [PL('p8', [735, 370, 380, 570], [I.x, I.y, I.w, I.h])], I.x, I.y);
    el('div', { position: 'absolute', left: px(I.x), top: px(I.y + I.h + 26), width: px(I.w), textAlign: 'center', fontSize: '15px', letterSpacing: '.18em', color: '#9a9183', fontWeight: 600 }, 'MH BRANDING · EDICIÓN 01');
  },
};

window.READY = Promise.all([document.fonts.load("800 100px Archivo"), document.fonts.load('600 20px Geist'),
  ...Object.values(IMG).map(([src]) => { const i = new Image(); i.src = src; return i.decode(); })]).then(() => {
  const s = new URLSearchParams(location.search).get('s') || 'glass';
  STILL[s]();
  return Promise.all([...document.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
});
</script>
</body>
</html>
